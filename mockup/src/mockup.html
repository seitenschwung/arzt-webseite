<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mockup Version 2</title>
<style>
@font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%; src: url(../../assets/fonts/archivo-var.woff2) format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 3200px; height: 2000px; overflow: hidden; }
/* the page's own device: two flat fields meeting at a hard seam */
body { position: relative; background: #003b39; font-family: "Archivo", sans-serif; color: #f7f7f5; }
body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1000px; background: #f7f7f5; }
.caption { position: absolute; left: 230px; top: 110px; display: flex; align-items: baseline; gap: 36px; }
.caption h1 { font-weight: 600; font-stretch: 116%; font-size: 76px; letter-spacing: -0.04em; color: #003b39; }
.caption p { font-size: 32px; color: #1b1b1b; }
.browser { position: absolute; left: 230px; top: 300px; width: 2000px; border-radius: 34px; background: #ebe9e5; overflow: hidden; box-shadow: 0 80px 160px rgba(0,0,0,.3), 0 20px 50px rgba(0,0,0,.18); }
.chrome { height: 74px; display: flex; align-items: center; gap: 16px; padding: 0 30px; background: #ebe9e5; }
.chrome b { width: 18px; height: 18px; border-radius: 50%; background: #c9c6c0; }
.url { margin-left: 26px; flex: 1; max-width: 760px; height: 42px; border-radius: 21px; background: #f7f7f5; display: flex; align-items: center; padding: 0 22px; font-size: 21px; color: #575653; }
.browser img { display: block; width: 100%; }
.phone { position: absolute; width: 520px; border-radius: 86px; background: #111; padding: 20px; box-shadow: 0 80px 140px rgba(0,0,0,.4), 0 20px 40px rgba(0,0,0,.25); }
.phone .screen { border-radius: 68px; overflow: hidden; background: #f7f7f5; padding-top: 64px; }
.phone img { display: block; width: 100%; }
.phone::after { content: ""; position: absolute; top: 38px; left: 50%; width: 150px; height: 42px; margin-left: -75px; border-radius: 21px; background: #111; }
.p1 { left: 1990px; top: 600px; }
.p2 { left: 2560px; top: 380px; }
.foot { position: absolute; left: 230px; bottom: 96px; right: 230px; display: flex; justify-content: space-between; align-items: baseline; font-size: 28px; color: #c6d6d2; }
.foot .line { font-weight: 560; font-stretch: 116%; font-size: 44px; letter-spacing: -0.03em; color: #f7f7f5; }
.chips { display: flex; gap: 14px; }
.chips span { display: inline-flex; align-items: center; gap: 14px; height: 54px; padding: 0 26px 0 18px; border-radius: 27px; background: #0d4d49; color: #f7f7f5; font-size: 24px; }
.chips span i { width: 26px; height: 26px; border-radius: 50%; background: var(--c); }
</style>
</head>
<body>
<div class="caption">
  <h1>Dr. med. Christoph Manicke</h1>
  <p>Neurochirurgie mit Schwerpunkt Wirbelsäule, Kiel · Website, Version 2</p>
</div>
<div class="browser">
  <div class="chrome"><b></b><b></b><b></b><div class="url">Dr. med. Christoph Manicke · Neurochirurgie Kiel</div></div>
  <img src="desk-hero.png" alt="">
</div>
<div class="phone p1"><div class="screen"><img src="phone-deal.png" alt=""></div></div>
<div class="phone p2"><div class="screen"><img src="phone-hero.png" alt=""></div></div>
<div class="foot">
  <span class="line">Farbkapitel im Stil von N26 und Gyn Paradeplatz</span>
  <span class="chips">
    <span><i style="--c:#f7f7f5"></i>Papier</span>
    <span><i style="--c:#ebe9e5"></i>Sand</span>
    <span><i style="--c:#003b39; outline: 2px solid #245f5a"></i>Petrol</span>
    <span><i style="--c:#5d6c67"></i>Salbei</span>
    <span><i style="--c:#c0e2bf"></i>Mint</span>
  </span>
</div>
</body>
</html>
