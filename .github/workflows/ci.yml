name: CI & Deploy

# Thin caller of the shared pipeline in seitenschwung/template: mailer tests (Dockerfile stage "test"),
# hardened Docker run, axe + Lighthouse browser tests, then on main: push the image to ghcr.io and deploy it
# to Coolify (https://christophmanicke.de, repository variables DEPLOY=auto and APP_DOMAIN), with rollback.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    permissions:
      contents: read
      packages: write
    uses: seitenschwung/template/.github/workflows/pipeline.yml@v1
    secrets: inherit

  # Preview: puts the link to the PR's preview app (https://arzt-webseite-pr<n>.seitenschwung.com) on top of
  # the PR description; on PRs labelled manual-review also a comment with before/after screenshots.
  # Runs when the tests fail too. The reusable workflow decides itself which events it acts on.
  preview:
    needs: pipeline
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
    uses: seitenschwung/template/.github/workflows/preview.yml@v1
    secrets: inherit
